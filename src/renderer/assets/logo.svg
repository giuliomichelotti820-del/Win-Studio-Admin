<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Studio Associato Amm. Burchielli">
  <title>Studio Associato Amm. Burchielli</title>
  <!-- Il marchio dello Studio dentro una tessera chiara.
       Il cuore del marchio e una "A" blu notte: su una barra laterale scura
       sparirebbe. La tessera bianca e la stessa che Windows mostra sulla barra
       delle applicazioni, quindi il simbolo dell'app e quello dell'icona
       coincidono ovunque compaiano. -->
  <defs>
    <linearGradient id="tesseraFondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="logoVerde" x1="24" y1="0" x2="104" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7A50"/>
      <stop offset="45%" stop-color="#F4F8F6"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F8F6"/>
      <stop offset="100%" stop-color="#2E7A50"/>
    </linearGradient>
    <linearGradient id="logoArancio" x1="0" y1="82" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8843D"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="126" height="126" rx="28" fill="url(#tesseraFondo)"/>
  <rect x="1" y="1" width="126" height="126" rx="28" fill="none" stroke="#0B2341" stroke-opacity=".14" stroke-width="2"/>

  <g transform="translate(64 66) scale(.78) translate(-64 -64)">
    <polyline points="24,101 64,28 104,101" fill="none" stroke="url(#logoVerde)" stroke-width="24" stroke-linejoin="miter" stroke-linecap="butt"/>
    <polyline points="48,96 64,64 80,96" fill="none" stroke="#0B2341" stroke-width="15" stroke-linejoin="miter" stroke-linecap="butt"/>
    <circle cx="64" cy="98" r="17" fill="url(#logoArancio)"/>
  </g>
</svg>
